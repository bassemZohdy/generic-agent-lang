[project]
name = "generic-agent-lang"
version = "0.1.0"
description = "A generic configuration-driven LangChain and LangGraph agent runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "mcp>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
google = ["langchain-google-genai>=2.0.0"]
community = ["langchain-community>=0.3.0"]
ollama = ["langchain-ollama>=0.2.0"]
groq = ["langchain-groq>=0.2.0"]
mistral = ["langchain-mistralai>=0.2.0"]
docker = ["docker>=7.0.0"]
gke = ["kubernetes>=29.0"]
all = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "docker>=7.0.0",
]

[project.scripts]
generic-agent = "generic_agent.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generic_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
